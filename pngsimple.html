<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<style>
    body {
      height: 100vh; flex-direction: column; justify-content: center; margin: 0;
      background-color: #808080; display: flex;overflow-y: hidden; align-items: center;
    }
    canvas {border: 8px solid black; margin-bottom: 16px;}
  </style>
</head>
<body>
  <canvas id="canvas" width="100" height="100"></canvas>
  <div><button id="saveButton">Save PNG</button><button id="loadButton">Load PNG</button>
  <input type="file" id="fileInput" accept="image/png" hidden></div>
<script>
/* The simplest legal PNG: RGBA, no filtering, no compression.
   File  = signature, then chunks IHDR, IDAT, IEND.
   Chunk = LENGTH(4) TYPE(4) DATA CRC(4)   (big-endian, CRC over TYPE+DATA)
   IDAT  = zlib stream: 78 01, deflate blocks, Adler-32 of the raw bytes.
   Trick: every scanline (filter byte 0 + pixels) is one "stored" deflate
   block: BFINAL, LEN, NLEN (little-endian), then the row bytes unchanged.
   A stored block holds at most 65535 bytes, so width is limited to 16383.
   decodePNG does the same steps backwards. It reads PNGs saved by
   encodePNG; compressed PNGs from other programs are refused. */
function crc32(bytes, start) {
  let c = 0xffffffff;
  for (let i = start; i < bytes.length; i++) {
    c ^= bytes[i];
    for (let k = 0; k < 8; k++) c = (c >>> 1) ^ ((c & 1) ? 0xedb88320 : 0);
  }
  return (c ^ 0xffffffff) >>> 0;
}

function be32(v) { return [v >>> 24 & 255, v >>> 16 & 255, v >>> 8 & 255, v & 255]; }

function encodePNG(w, h, rgba) {
  const out = [137, 80, 78, 71, 13, 10, 26, 10];          // signature
  function chunk(type, data) {
    out.push(...be32(data.length));
    const start = out.length;                             // CRC starts at TYPE
    for (const ch of type) out.push(ch.charCodeAt(0));
    for (const b of data) out.push(b);
    out.push(...be32(crc32(out, start)));
  }
  // width, height, bit depth 8, colour type 6 (RGBA), compression, filter, interlace
  chunk("IHDR", [...be32(w), ...be32(h), 8, 6, 0, 0, 0]);
  const n = w * 4 + 1;                                    // row = filter byte + pixels
  if (n > 65535) throw new Error("max width is 16383");
  const z = [0x78, 0x01];                                 // zlib header
  let a = 1, b = 0;                                       // Adler-32 sums
  for (let y = 0; y < h; y++) {
    z.push(y === h - 1 ? 1 : 0, n & 255, n >>> 8, ~n & 255, ~n >>> 8 & 255);
    for (let i = 0; i < n; i++) {
      const v = (i === 0) ? 0 : rgba[y * (n - 1) + i - 1];  // filter 0, then RGBA
      z.push(v); a = (a + v) % 65521; b = (b + a) % 65521;
    }
  }
  z.push(...be32(b * 65536 + a));                         // Adler-32
  chunk("IDAT", z); chunk("IEND", []);
  return new Uint8Array(out);
}

function get32(bytes, pos) {
  return (bytes[pos] << 24 | bytes[pos + 1] << 16 | bytes[pos + 2] << 8 | bytes[pos + 3]) >>> 0;
}
// The saver in reverse. Reads only simple PNGs: 8-bit RGBA, stored blocks, filter 0.
function decodePNG(file) {
  for (let i = 0; i < 8; i++)
    if (file[i] !== [137, 80, 78, 71, 13, 10, 26, 10][i]) throw new Error("not a PNG");
  let w = 0, h = 0; const z = [];                                           // the IDAT data, joined
  for (let pos = 8; pos < file.length; ) {
    const len = get32(file, pos), d = pos + 8;            // d = start of DATA
    const type = String.fromCharCode(...file.subarray(pos + 4, d));
    if (crc32(file.subarray(pos + 4, d + len), 0) !== get32(file, d + len))
      throw new Error("CRC error in " + type);
    if (type === "IHDR") {
      w = get32(file, d); h = get32(file, d + 4);
      if (file[d + 8] !== 8 || file[d + 9] !== 6 || file[d + 12] !== 0)
        throw new Error("only 8-bit RGBA, not interlaced");
    }
    if (type === "IDAT") for (let i = d; i < d + len; i++) z.push(file[i]);
    pos = d + len + 4;                                    // other chunks are skipped
  }
  const raw = [];                                         // stored blocks -> raw rows
  for (let p = 2, last = 0; !last; ) {                    // p = 2 skips the zlib header
    last = z[p] & 1;
    if (z[p] >> 1 & 3) throw new Error("compressed PNG");
    const n = z[p + 1] | z[p + 2] << 8;
    for (let i = p + 5; i < p + 5 + n; i++) raw.push(z[i]);
    p += 5 + n;
  }
  const n = w * 4 + 1, rgba = new Uint8ClampedArray(w * h * 4);
  for (let y = 0; y < h; y++) {                           // drop each row's filter byte
    if (raw[y * n] !== 0) throw new Error("filtered PNG");
    rgba.set(raw.slice(y * n + 1, (y + 1) * n), y * (n - 1));
  }
  return { w, h, rgba };
}
function saveCanvasAsPNG(canvas) {
  const rgba = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height).data;
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([encodePNG(canvas.width, canvas.height, rgba)], { type: "image/png" }));
  link.download = "canvas.png"; link.click();
}
function loadPNG(canvas, file) {
  file.arrayBuffer().then(buf => {
    const { w, h, rgba } = decodePNG(new Uint8Array(buf));
    canvas.width = w; canvas.height = h; canvas.getContext("2d").putImageData(new ImageData(rgba, w, h), 0, 0);
  }).catch(e => alert("Could not load: " + e.message));
}
document.addEventListener("DOMContentLoaded", () => {
  const canvas = document.getElementById("canvas");
  const fileInput = document.getElementById("fileInput");
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "red"; ctx.globalAlpha = 0.5; ctx.fillRect(10, 10, 80, 80);
  document.getElementById("saveButton").addEventListener("click", () => saveCanvasAsPNG(canvas));
  document.getElementById("loadButton").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    if (fileInput.files[0]) loadPNG(canvas, fileInput.files[0]);
    fileInput.value = "";
  });
});
</script>
</body>
</html>
