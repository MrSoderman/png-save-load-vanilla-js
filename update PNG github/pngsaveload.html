<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<style>
    body {
      height: 100vh; flex-direction: column; justify-content: center; margin: 0; 
      background-color: #808080; display: flex;overflow-y: hidden; align-items: center;
    }
    canvas {border: 8px solid black; margin-bottom: 16px;}
  </style>
</head>

<body>
  <canvas id="canvas" width="100" height="100"></canvas>
  <div><button id="saveButton">Save PNG</button><button id="loadButton">Load PNG</button>
  <input type="file" id="fileInput" accept="image/png" hidden></div>
<script>
/* =====================================================================
   PNG IN A NUTSHELL
   =====================================================================
   A PNG file are just bytes, laid out like this:
   1. SIGNATURE - 8 fixed bytes: 137 'P' 'N' 'G' 13 10 26 10.
      They say "I am a PNG" and catch files damaged by text-mode copying.
   2. A list of CHUNKS. Every chunk has the same 4 parts:
        LENGTH  4 bytes  how many DATA bytes follow (big-endian = high byte first)
        TYPE    4 bytes  four ASCII letters, e.g. "IHDR"
        DATA    LENGTH bytes
        CRC     4 bytes  a checksum of TYPE+DATA, so damage can be detected
   3. The chunks we need:
        IHDR  "image header": width, height, bit depth, colour type ...
        IDAT  "image data":   the pixels (compressed)
        IEND  "image end":    empty, marks the end of the file
   HOW THE PIXELS ARE STORED
   - The image is stored row by row (a row = a "scanline").
   - Every row starts with one FILTER byte. A filter rewrites the row as
     differences from neighbouring pixels, which compresses better.
     Filter 0 means "no filter": the row is stored as-is.
   - All rows together are compressed with ZLIB. A zlib stream is:
        2-byte header | DEFLATE data | 4-byte Adler-32 checksum
   - DEFLATE has three block kinds: 0 = stored (no compression),
     1 = fixed Huffman codes, 2 = dynamic Huffman codes.
   It uses filter 0 and "stored" blocks, so no compression but 100% legal PNG.
   ===================================================================== */
const PNG_SIGNATURE = [137, 80, 78, 71, 13, 10, 26, 10];
/* ---------------------------------------------------------------------
   CHECKSUMS
   --------------------------------------------------------------------- */
// CRC-32 (used for every chunk). The table holds the result for every
// possible byte, so we process a whole byte per step instead of 8 bits.
const CRC_TABLE = new Uint32Array(256);
for (let n = 0; n < 256; n++) {
  let c = n;
  for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
  CRC_TABLE[n] = c;
}
// CRC-32 of buf[start .. end-1]
function crc32(buf, start, end) {
  let c = 0xFFFFFFFF;
  for (let i = start; i < end; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0; // >>> 0 makes it an unsigned number
}
// Adler-32 (used by zlib, over the UNcompressed data). Two running sums.
function adler32(buf, start, end) {
  let a = 1, b = 0;
  for (let i = start; i < end; i++) {
    a = (a + buf[i]) % 65521; // 65521 = largest prime below 65536
    b = (b + a) % 65521;
  }
  return ((b << 16) | a) >>> 0;
}
/* ---------------------------------------------------------------------
   BYTE HELPERS  (PNG numbers are big-endian: high byte first)
   --------------------------------------------------------------------- */
// Write a 32-bit number at buf[pos]; returns the position after it.
function put32(buf, pos, v) {
  buf[pos]     = (v >>> 24) & 255; buf[pos + 1] = (v >>> 16) & 255;
  buf[pos + 2] = (v >>> 8)  & 255; buf[pos + 3] =  v         & 255;
  return pos + 4;
}
// Read a 32-bit number from buf[pos].
function get32(buf, pos) {
  return ((buf[pos] << 24) | (buf[pos + 1] << 16) | (buf[pos + 2] << 8) | buf[pos + 3]) >>> 0;
}
// Write one chunk (LENGTH, TYPE, DATA, CRC) at out[pos].
// data is a Uint8Array, dataLen how many of its bytes to use.
// Returns the position after the chunk.
function putChunk(out, pos, type, data, dataLen) {
  pos = put32(out, pos, dataLen);                               // LENGTH
  const typeStart = pos;
  for (let i = 0; i < 4; i++) out[pos++] = type.charCodeAt(i);  // TYPE
  out.set(data.subarray(0, dataLen), pos);                      // DATA
  pos += dataLen;
  return put32(out, pos, crc32(out, typeStart, pos));           // CRC of TYPE+DATA
}
/* =====================================================================
   ENCODER  (RGBA pixels -> PNG bytes)
   ===================================================================== */
const MAX_STORED = 65535;    // largest stored DEFLATE block (16-bit length)
// w, h  : image size in pixels
// rgba  : w*h*4 bytes, R G B A per pixel (exactly what getImageData gives)
// returns a Uint8Array holding the whole .png file
function encodePNG(w, h, rgba) {
  // --- Step 1: raw scanlines = filter byte 0 + the row's pixels ---------
  const rowBytes = w * 4;
  const rawLen   = h * (1 + rowBytes);
  const raw      = new Uint8Array(rawLen);
  let r = 0;
  for (let y = 0; y < h; y++) {
    raw[r++] = 0;               // filter 0 = none
    raw.set(rgba.subarray(y * rowBytes, (y + 1) * rowBytes), r);
    r += rowBytes;
  }
  // --- Step 2: wrap them in a zlib stream of STORED blocks --------------
  // Each stored block = 1 header byte + LEN (2) + NLEN (2) + the bytes.
  const blocks = Math.ceil(rawLen / MAX_STORED);
  const zLen   = 2 + blocks * 5 + rawLen + 4;
  const z      = new Uint8Array(zLen);
  let p = 0;
  // zlib header: 0x78 = "deflate, 32K window"; 0x01 = "fastest" level.
  // The rule: (first*256 + second) must divide evenly by 31. 0x7801 does.
  z[p++] = 0x78;
  z[p++] = 0x01;
  let src = 0;
  for (let b = 0; b < blocks; b++) {
    const len = Math.min(MAX_STORED, rawLen - src);
    // Header byte: bit 0 = BFINAL (1 on the last block), bits 1-2 = BTYPE 00 (stored)
    z[p++] = (b === blocks - 1) ? 1 : 0;
    // LEN, little-endian (DEFLATE is little-endian, unlike PNG!)
    z[p++] = len & 255;
    z[p++] = len >>> 8;
    // NLEN = LEN with all bits flipped; a safety check for the reader
    z[p++] = ~len & 255;
    z[p++] = (~len >>> 8) & 255;
    // the bytes themselves, copied unchanged
    z.set(raw.subarray(src, src + len), p);
    p += len;
    src += len;
  }
  put32(z, p, adler32(raw, 0, rawLen)); // zlib trailer: checksum of raw data
  // --- Step 3: build the file: signature + IHDR + IDAT + IEND -----------
  const ihdr = new Uint8Array(13);
  put32(ihdr, 0, w);
  put32(ihdr, 4, h);
  ihdr[8]  = 8;    // bit depth: 8 bits per channel
  ihdr[9]  = 6;    // colour type 6 = RGBA
  ihdr[10] = 0;    // compression method (always 0 = zlib)
  ihdr[11] = 0;    // filter method (always 0)
  ihdr[12] = 0;    // interlace: 0 = none
  // every chunk costs 12 bytes (LENGTH + TYPE + CRC) plus its data
  const png = new Uint8Array(8 + (12 + 13) + (12 + zLen) + 12);
  png.set(PNG_SIGNATURE, 0);
  let q = 8;
  q = putChunk(png, q, "IHDR", ihdr, 13);
  q = putChunk(png, q, "IDAT", z, zLen);
  putChunk(png, q, "IEND", ihdr, 0); // 0 bytes of data
  return png;
}
/* =====================================================================
   OPTIONAL LOADER  (PNG bytes -> RGBA pixels)  - UNCOMPRESSED PNGs ONLY
   =====================================================================
   The browser can already load PNGs. This loader is here so you can see
   how it works, and so pixels come back EXACTLY as they were saved.

   It reads the same simple kind of PNG our saver writes:
     - 8 bits per channel, RGBA (colour type 6) or RGB (colour type 2)
     - "stored" DEFLATE blocks, i.e. no compression
     - not interlaced
   It also undoes all 5 filters, so uncompressed PNGs from other
   programs work too. Anything else gives a clear error message:
   use the standard loader for those.
   Results go into three globals: pngW, pngH, pngRGBA.
   ===================================================================== */
let pngW = 0, pngH = 0, pngRGBA = null;
/* ---- UNFILTER ---------------------------------------------------------
   A saver may rewrite each row with one of 5 filters (our saver always
   uses 0 = none). To undo a filter we add back the neighbour it took away:
        c b      c = up-left,  b = up
        a x      a = left,     x = this byte
   "Left" means the same colour channel of the previous pixel.
   ---------------------------------------------------------------------- */
function paeth(a, b, c) {  // pick whichever of a, b, c is closest to a + b - c
  const p = a + b - c;
  const pa = Math.abs(p - a), pb = Math.abs(p - b), pc = Math.abs(p - c);
  if (pa <= pb && pa <= pc) return a;
  return (pb <= pc) ? b : c;
}
// raw: rows of (filter byte + rowBytes bytes)  ->  img: rows of rowBytes bytes
function unfilter(raw, img, h, rowBytes, bpp) {
  for (let y = 0; y < h; y++) {
    const f   = raw[y * (rowBytes + 1)];          // the filter byte
    const src = y * (rowBytes + 1) + 1;
    const dst = y * rowBytes;
    const up  = dst - rowBytes;                   // start of the row above
    for (let x = 0; x < rowBytes; x++) {
      const a = (x >= bpp)          ? img[dst + x - bpp] : 0;
      const b = (y > 0)             ? img[up + x]        : 0;
      const c = (x >= bpp && y > 0) ? img[up + x - bpp]  : 0;
      let v = raw[src + x];
      if      (f === 1) v += a;                   // Sub
      else if (f === 2) v += b;                   // Up
      else if (f === 3) v += (a + b) >> 1;        // Average
      else if (f === 4) v += paeth(a, b, c);      // Paeth
      else if (f !== 0) throw new Error("bad filter type " + f);
      img[dst + x] = v & 255;                     // wrap around, like a byte
    }
  }
}
/* ---- THE LOADER ------------------------------------------------------- */
function decodePNG(file) {
  // --- Step 1: check the 8-byte signature ---
  for (let i = 0; i < 8; i++)
    if (file[i] !== PNG_SIGNATURE[i]) throw new Error("not a PNG file");
  // --- Step 2: walk the chunks, keep IHDR info and the IDAT pieces ---
  let w = 0, h = 0, depth = 0, ctype = 0, interlace = 0;
  const idat = []; let idatLen = 0;
  let pos = 8;
  while (pos + 12 <= file.length) {
    const len  = get32(file, pos);
    const type = String.fromCharCode(file[pos + 4], file[pos + 5], file[pos + 6], file[pos + 7]);
    const d    = pos + 8;                                 // start of DATA
    if (d + len + 4 > file.length) throw new Error("chunk " + type + " is cut off");
    if (crc32(file, pos + 4, d + len) !== get32(file, d + len))
      throw new Error("CRC error in chunk " + type);
    if (type === "IHDR") {
      w = get32(file, d); h = get32(file, d + 4);
      depth = file[d + 8]; ctype = file[d + 9]; interlace = file[d + 12];
    }
    else if (type === "IDAT") { idat.push(file.subarray(d, d + len)); idatLen += len; }
    else if (type === "IEND") break;
    // any other chunk (text, gamma, ...) is simply skipped
    pos = d + len + 4;
  }
  if (!w || !h)                      throw new Error("no IHDR chunk");
  if (depth !== 8)                   throw new Error("only 8-bit PNGs - use the standard loader");
  if (ctype !== 6 && ctype !== 2)    throw new Error("only RGB/RGBA PNGs - use the standard loader");
  if (interlace)                     throw new Error("interlaced PNG - use the standard loader");
  // --- Step 3: the IDAT chunks are ONE zlib stream cut into pieces: join them ---
  const z = new Uint8Array(idatLen);
  let zp = 0;
  for (const part of idat) { z.set(part, zp); zp += part.length; }
  if ((z[0] & 15) !== 8 || ((z[0] << 8) | z[1]) % 31 !== 0)
    throw new Error("bad zlib header"); 
  // --- Step 4: read the stored blocks, copying their bytes into raw ---
  // In a stream of only stored blocks, each block starts on a whole byte:
  //   1 header byte | LEN (2, little-endian) | NLEN (2) | LEN bytes
  const bpp      = (ctype === 6) ? 4 : 3;           // bytes per pixel
  const rowBytes = w * bpp;
  const raw      = new Uint8Array(h * (1 + rowBytes));
  let p = 2, o = 0, last = 0;                       // p = 2: skip the zlib header
  while (!last) {
    if (p + 5 > z.length) throw new Error("PNG data ends too early");
    const hdr = z[p]; last = hdr & 1; // BFINAL bit
    if ((hdr >> 1) & 3) throw new Error("compressed PNG - use the standard loader");
    const len  = z[p + 1] | (z[p + 2] << 8);
    const nlen = z[p + 3] | (z[p + 4] << 8);
    if (len !== (~nlen & 0xFFFF))  throw new Error("block length check failed");
    p += 5;
    if (p + len > z.length)        throw new Error("PNG data ends too early");
    if (o + len > raw.length)      throw new Error("too much pixel data");
    raw.set(z.subarray(p, p + len), o);
    p += len; o += len;
  }
  if (o !== raw.length)            throw new Error("too little pixel data");
  if (p + 4 > z.length || adler32(raw, 0, o) !== get32(z, p))
    throw new Error("Adler-32 checksum error");
  // --- Step 5: undo the filters ---
  const img = new Uint8Array(h * rowBytes);
  unfilter(raw, img, h, rowBytes, bpp);
  // --- Step 6: make RGBA (RGB images get alpha 255 = fully opaque) ---
  const out = new Uint8ClampedArray(w * h * 4);
  if (bpp === 4) out.set(img);
  else for (let i = 0, j = 0; i < w * h; i++) {
    out[j++] = img[i * 3]; out[j++] = img[i * 3 + 1]; out[j++] = img[i * 3 + 2]; out[j++] = 255;
  }
  pngW = w; pngH = h; pngRGBA = out;
}
/* =====================================================================
   PAGE WIRING  (buttons, canvas)
   ===================================================================== */
function saveCanvasAsPNG(canvas) {
  const ctx  = canvas.getContext("2d");
  const rgba = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  const blob = new Blob([encodePNG(canvas.width, canvas.height, rgba)], { type: "image/png" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "canvas.png";
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);   // free the memory
}
// STANDARD loader: let the browser decode the PNG.
// Note: the browser may round semi-transparent colours very slightly.
function loadWithBrowser(canvas, file) {
  createImageBitmap(file).then(bmp => {
    canvas.width = bmp.width;              // resizing also clears the canvas
    canvas.height = bmp.height;
    canvas.getContext("2d").drawImage(bmp, 0, 0);
  }).catch(e => alert("Could not load: " + e.message));
}
// OWN loader: our decodePNG above (uncompressed PNGs only).
// putImageData writes the pixels back exactly, no rounding.
function loadWithOwnDecoder(canvas, file) {
  file.arrayBuffer().then(buf => {
    decodePNG(new Uint8Array(buf));
    canvas.width = pngW;
    canvas.height = pngH;
    canvas.getContext("2d").putImageData(new ImageData(pngRGBA, pngW, pngH), 0, 0);
  }).catch(e => alert("Could not load: " + e.message));
}
document.addEventListener("DOMContentLoaded", () => {
  const canvas    = document.getElementById("canvas");
  const fileInput = document.getElementById("fileInput");
  const ctx = canvas.getContext("2d");
  // demo picture: a red square with 50% transparency
  ctx.fillStyle = "red"; ctx.globalAlpha = 0.5; ctx.fillRect(10, 10, 80, 80);
  document.getElementById("saveButton").addEventListener("click", () => saveCanvasAsPNG(canvas));
  document.getElementById("loadButton").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) return;
    loadWithBrowser(canvas, file);          // <-- standard loader
    // loadWithOwnDecoder(canvas, file);    // <-- uncomment this, and comment out the line above,
                                            //     to load with our own loader instead
                                            //     (uncompressed PNGs only)
    fileInput.value = "";                   // so the same file can be picked again
  });
});
</script>
</body>
</html>
